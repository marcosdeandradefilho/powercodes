<script>
const brandFloat=document.querySelector('.brand-float');
if(brandFloat&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  window.addEventListener('pointermove',e=>{
    const px=(e.clientX/window.innerWidth-.5), py=(e.clientY/window.innerHeight-.5);
    brandFloat.style.transform=`translate(${px*-22}px, ${py*-16}px)`;
  });
}
document.querySelectorAll('[data-tilt]').forEach(c=>{
  c.addEventListener('pointermove',e=>{
    const r=c.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
    c.style.transform=`translateY(-6px) rotateY(${px*14}deg) rotateX(${-py*14}deg)`;
  });

});
